[package]
name = "symbi-aot"
version = "0.1.0"
edition = "2024"

# build.rs runs the substrate (discretize/ir) to generate kernels as rust source via
# emit_kernel_cpu; this crate include!s and compiles them. the substrate is a
# build-dependency only. the one runtime dependency is symbi-algebra: the generated
# kernels are generic `fn k<S: Scalar>`, and `Scalar` is
# symbi-algebra's — the same trait the physics layer (Regime/Eos/Metric/Field)
# uses, so one scalar threads through both.

[dependencies]
symbi-algebra    = { path = "../symbi-algebra" }
symbi-ir         = { path = "../symbi-ir" }
# the AOT CPU kernels emitted by the rust renderer parallelize the
# outer cell loop via `rayon::iter::IntoParallelIterator`. one threading
# backend, no manual stack of dim-N nested fors.
rayon            = "1"
# stack-resident small vectors: the per-dispatch input/output binding lists are
# bounded by the kernel's buffer count (<= ~12), so they live inline instead of
# heap-allocating on every kernel call. spills to heap only past the inline cap.
smallvec         = "1"

[build-dependencies]
symbi-discretize = { path = "../symbi-discretize" }
symbi-ir         = { path = "../symbi-ir" }
# the gv-kernel fusion algebra (`LaunchGrade::from_domain`) tags pair-fuse
# candidates with the canonical 3D interior `Domain<3>` so try_fuse accepts the
# god + bcell merge at build time.
symbi-algebra    = { path = "../symbi-algebra" }
# single-sources MAX_BODIES for the immersed-body kernel codegen (body_source /
# body_feedback) so the generated scalar-param count cannot drift from the runtime.
symbi-ib         = { path = "../symbi-ib" }
# the fused-source godunov AOT-bakes a SourceSpec into the
# kernel at build time (one launch covers div(F) + integrator + spliced source).
# symbi-hydro owns the SourceSpec library (uniform_acceleration, point_mass_grav,
# etc.); the build needs it to enumerate the (regime, dim, source) instances.
symbi-hydro      = { path = "../symbi-hydro" }

[dev-dependencies]
# the penalize kernel's f64 reference chain uses SdfExpr + penalize_cell.
symbi-ib         = { path = "../symbi-ib" }
# render the generated `_IR` blobs back to source to check deserialization and rendering.
# this is a development dependency; symbi-aot stays a thin artifact holder and the render lives
# in symbi-ir.
symbi-ir         = { path = "../symbi-ir" }
# carrier-equivalence tests: run the host physics (f<f64>) against the compiled
# kernel (f traced at Gv) at the same baked iteration count.
symbi-hydro      = { path = "../symbi-hydro" }
# curvilinear penalize gate: the coordinate->Cartesian centroid map (Metric).
symbi-geometry   = { path = "../symbi-geometry" }

[features]
# debug-emit-knobs: forwards to symbi-ir; also gates the SYMBI_GEN_SERIAL read in build.rs. off by default = canonical env-unset shape.
debug-emit-knobs = ["symbi-ir/debug-emit-knobs"]

# cpu kernel throughput bench. custom main(), so harness = false.
[[bench]]
name = "cpu_kernel_bench"
harness = false

[lints]
workspace = true
