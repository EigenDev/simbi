[package]
name = "symbi-io"
version = "0.1.0"
edition = "2024"
description = "schema-driven serialization for symbi — one Schema feeds HDF5 checkpoint, JSON introspection, and ASCII / symbi-display table renderers."

[dependencies]
# the shared canonical regime / field-spec metadata. drives field discovery so
# the I/O layer never hand-spells m1..mD again — `regime.fields()` is the
# source of truth.
symbi-hydro = { path = "../symbi-hydro" }
# Field lives here; we read it cell-by-cell over a Domain.
symbi-grid = { path = "../symbi-grid" }
# Domain (the iteration shape behind every Field).
symbi-algebra = { path = "../symbi-algebra" }
# the per-backend writers; HDF5 is the production checkpoint format. `static` compiles the
# bundled HDF5 C sources instead of probing for a system install, which keeps the checkpoint
# format pinned to one library version across every machine the code builds on.
hdf5-metno = { version = "0.12", features = ["static"] }

[lints]
workspace = true
