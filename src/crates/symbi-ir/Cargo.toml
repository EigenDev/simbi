[package]
name = "symbi-ir"
version = "0.1.0"
edition = "2024"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
# the lowered IR (`Prepared`) is the durable backend-neutral
# artifact: build.rs serializes it into the binary, the runtime renders+JITs any
# accelerator from it. serde derives the round-trip; serde_json is the wire format.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
# the `Gv` carrier (gv.rs) impls `symbi_algebra::Scalar` to trace carrier-generic
# physics into this crate's tensor IR. consolidated 2026-05-30: symbi-core folded in.
symbi-algebra = { path = "../symbi-algebra" }
# the typed trace<->dispatch ABI vocabulary (FieldRef/ScalarRef/MeshScalar). lifted
# out of this crate 2026-06-24 so the graph-theoretic IR no longer spells the closed
# hydro field/scalar names; the IR carries the generic `FieldBind`/`ScalarBind`
# containers and re-exports the vocabulary for downstream callers.
symbi-abi = { path = "../symbi-abi" }

[features]
# debug-emit-knobs: opt-in reading of SYMBI_TILE_CPU / SYMBI_VEC_LOOP / SYMBI_GEN_SERIAL a/b perf knobs. off by default = canonical env-unset emission shape.
debug-emit-knobs = []

[lints]
workspace = true
