[package]
name = "symbi-discretize"
version = "0.1.0"
edition = "2024"

# the bridge crate: instantiates the carrier-generic symbi-hydro physics at
# S = Gv to TRACE it into discrete stencil DAGs in symbi-ir. the choice of
# discretization (geometry, spacing, reconstruction) is a value the caller
# selects; the physics source is unchanged. this is where numerical choices
# live and only here.

[dependencies]
# the Gv carrier + trace live alongside Op + Graph in symbi-ir (consolidated
# 2026-05-30; symbi-core was folded in). discretize traces carrier-generic
# physics into the tensor IR through this single dep.
symbi-ir      = { path = "../symbi-ir" }
# the Gv carrier impls symbi_algebra::Scalar to trace physics into the tensor IR.
symbi-algebra = { path = "../symbi-algebra" }
# the dep flip (design/gv_algebra_unification.md §2): discretize instantiates the
# carrier-generic symbi-hydro physics at S=Gv to BUILD kernels — one physics source.
symbi-hydro   = { path = "../symbi-hydro" }
# the SINGLE-SOURCE geometric Christoffel source: discretize traces `Metric<Gv, D>` at S=Gv
# instead of re-deriving the spherical/cylindrical inertial by hand (B1). one geometry source.
symbi-geometry = { path = "../symbi-geometry" }

[dev-dependencies]
# the bridge test builds a user-expression Dag and lowers it via symbi_hydro::expr_bridge.
symbi-expr = { path = "../symbi-expr" }

[lints]
workspace = true
