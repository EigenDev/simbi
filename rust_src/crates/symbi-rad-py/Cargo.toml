[package]
name = "symbi-rad-py"
version.workspace = true
edition.workspace = true

# the radiation post-processing python module — the rust replacement for the
# legacy C++ `rad_hydro`. `name = "rad_hydro"` makes the init symbol
# `PyInit_rad_hydro`, so `simbi.libs.rad_hydro` imports it unchanged.
[lib]
name = "rad_hydro"
crate-type = ["cdylib", "rlib"]

[dependencies]
symbi-afterglow = { path = "../symbi-afterglow" }
symbi-afterglow-io = { path = "../symbi-afterglow-io" }
pyo3 = { version = "0.23", features = ["extension-module"] }
