[package]
name = "symbi-expr"
version.workspace = true
edition.workspace = true

[dependencies]
# the python -> json -> rust source front door: serde round-trips the serialized DAG
# (SourceConfig / NodeDesc), serde_json is the wire format. same pair symbi-ir uses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

