[workspace]
members = [
    "base",
    "grid",
    "compute",
    "xpu/core",
    "xpu/host",
    "xpu/cuda",
    "xpu/metal",
    "physics",
    "containers",
    "geometry",
    "sim",
    "functional",
    "context",
    "io",
    "traits",
    "utility",
    "dispatch",
    "config",
    "cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Marcus DuPont <md9952@nyu.edu>"]
license = "MIT OR Apache-2.0"
rust-version = "1.75"
repository = "https://github.com/astroboylrx/simbi"

[workspace.dependencies]
# internal crates
base = { path = "base" }
grid = { path = "grid" }
compute = { path = "compute" }
xpu-core = { path = "xpu/core" }
xpu-host = { path = "xpu/host" }
xpu-cuda = { path = "xpu/cuda" }
xpu-metal = { path = "xpu/metal" }
physics = { path = "physics" }
containers = { path = "containers" }
geometry = { path = "geometry" }
sim = { path = "sim" }
functional = { path = "functional" }
context = { path = "context" }
io = { path = "io" }
traits = { path = "traits" }
utility = { path = "utility" }
dispatch = { path = "dispatch" }
config = { path = "config" }

# external dependencies
rayon = "1.10"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[build]
rustflags = ["-C", "target-cpu=native", "-C", "opt-level=3"]

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
debug = true
