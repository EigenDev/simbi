[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "simbi"
version = "0.8.0"
authors = [
    {name = "Marcus DuPont"},
    {email = "marcus.dupont@princeton.edu"}
]
description = "Python module to solve relativistic (magneto)hydrodynamics with a rust backend"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["physics", "relativity"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "h5py",
    "matplotlib",
    "astropy",
    "halo",
    "rich",
    "pydantic",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
visual = ["cmasher"]
cli = ["rich-argparse"]

# dev tooling installed by `uv sync` (PEP 735). maturin is the BUILD tool that `./dev.py
# install` (maturin develop) needs in the venv; it is also in [build-system] requires for
# `pip install .` / wheel builds. patchelf is needed ONLY on linux — maturin shells out to it
# to set the extension's RPATH (the .so links external libs: hdf5, and libcuda/libnvrtc on gpu);
# macos uses the built-in install_name_tool instead. neither is a runtime dependency.
[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "patchelf; sys_platform == 'linux'",
]

[project.scripts]
simbi = "simbi.cli.__main__:main"

[project.urls]
repository    = "https://github.com/EigenDev/simbi"
documentation = "https://github.com/EigenDev/simbi"

# =============================================================================
# maturin: build the symbi-py pyo3 crate -> simbi/libs/cpu_ext, bundle the simbi
# python package. one tool (cargo via maturin) replaces meson + setuptools.
#   build:        maturin build --release          (wheel)
#   dev/editable: maturin develop --release        (used by dev.py)
#   gpu:          ... --features cuda               (cargo feature; NVRTC JIT at runtime)
# the rust is a WORKSPACE, so manifest-path points at the symbi-py crate; the
# extension lands at simbi/libs/cpu_ext via module-name.
# =============================================================================
[tool.maturin]
manifest-path = "src/crates/symbi-py/Cargo.toml"
python-source = "."
module-name = "simbi.libs.cpu_ext"

[tool.mypy]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
disable_error_code = ["prop-decorator"]
